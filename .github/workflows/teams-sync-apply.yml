name: TEAMS.md Sync Apply

on:
  push:
    branches: [main]
    paths: [TEAMS.md]

jobs:
  apply:
    name: Apply sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply sync
        env:
          GH_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        run: |
          python scripts/sync.py --file TEAMS.md --apply > sync-output.txt 2>&1
          exit_code=$?
          cat sync-output.txt
          exit $exit_code

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## TEAMS.md Sync — Applied"
            echo ""
            echo '```'
            cat sync-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
